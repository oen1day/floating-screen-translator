plugins {
    id "com.android.application"
}

android {
    namespace "io.github.oen1day.floatingtranslator"
    compileSdk 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "io.github.oen1day.floatingtranslator"
        minSdk 26
        targetSdk 34
        versionCode 33
        versionName "1.11.3-speed"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                def armArch = project.findProperty("screenTranslatorArmArch") ?: ""
                arguments "-DANDROID_STL=c++_shared",
                        "-DCMAKE_BUILD_TYPE=Release",
                        "-DGGML_CPU_ARM_ARCH=${armArch}"
                cppFlags "-O3 -DNDEBUG"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.29.2"
        }
    }
}

dependencies {
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
    implementation "com.google.mlkit:text-recognition-japanese:16.0.1"
    implementation "com.google.mlkit:text-recognition-korean:16.0.1"
    implementation "com.google.mlkit:translate:17.0.3"
    implementation "com.google.mediapipe:tasks-genai:0.10.35"
    implementation "com.google.ai.edge.litertlm:litertlm-android:0.19.1"
}
